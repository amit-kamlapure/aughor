# Track A7 (docs/TENX_PROGRAM_2026-11-05.md) — the scheduled checks a public repository owes
# itself, deliberately OFF the pull-request path: a dependency advisory published overnight
# is not a reason a PR is red, and CodeQL's minutes belong to the night. Dependabot
# (.github/dependabot.yml) opens the fixes; this is what finds them. Every action is pinned
# to a commit, as in ci.yml.
name: Security

on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays, 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  dependency-audit:
    name: Dependency audit · pip-audit + npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      # The locked resolution, every extra, no hashes (pip-audit reads names and versions). `--no-emit-project` leaves
      # out the project's own `-e .` line: under `--strict`, pip-audit fails on a package it cannot find on PyPI, so
      # from 2026-11-05 to 11-08 every run stopped on `aughor 0.1.0` before auditing a single dependency (it found 186
      # advisories in 23 packages the first time it ran whole).
      - name: pip-audit over uv.lock
        run: |
          uv export --all-extras --frozen --no-hashes --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit@2.9.0 -r requirements-audit.txt --strict --desc on
      # Runtime dependencies only: a dev-only advisory never reaches a running install. Run whatever pip-audit said —
      # one audit's findings must never hide the other's (the step was skipped on every run until 2026-11-08).
      - name: npm audit (production)
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
