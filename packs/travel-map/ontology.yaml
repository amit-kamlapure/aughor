# The travel, airline and hospitality industry vocabulary (AUGHOR_ATLAS_INDUSTRY_VOCABULARY_v1, 2026-11-11: 59
# reference types) as an industry map: expectations matched to tables by name or alias, never facts. Sixty objects.
#
# Three of them — Airport, Aircraft and Airline — are THIS PACKAGE'S ADDITIONS, not the vocabulary's: its travel list
# names a Flight, a Route and a Seat but no airport, aircraft or carrier, which any airline holds. This package stands
# alone; it neither extends nor changes the `airline` pack.
#
# Two reference types are folded into a near-identical one and kept as its aliases:
#   * Passenger       → Traveler
#   * Reaccommodation → Rebooking
#
# Two readings were made, and both are this package's, not the vocabulary's:
#   * its ten classes are read onto the eight roles this map has — by meaning, not by its class column (it calls a Room
#     Assignment a place, a Loyalty Member a generic business object and a Service Provider a digital service);
#   * a record of activity is a PART of the thing it happened to (a booking's items and amendments, a stay's room
#     assignments, a member's point transactions), never a thing beside it — the vocabulary lists each as a type of
#     its own.
# The vocabulary names no table spellings; every alias below is a guess the data confirms or leaves unmatched. Nothing
# here creates an object: one the data has no table for is never proposed and never mentioned.
objects:
  # Who.
  - name: Traveler
    roles: [party]
    aliases: [travelers, travellers, traveler, traveller, passengers, passenger, customers]
    description: the person who travels — the vocabulary's Traveler and Passenger
  - name: GuestProfile
    roles: [party]
    aliases: [guest_profiles, guest_profile, guests, guest]
  - name: LoyaltyMember
    roles: [party]
    aliases: [loyalty_members, loyalty_member, loyalty_accounts, frequent_flyers, members]
    parts: [LoyaltyPointTransaction]
  - name: LoyaltyPointTransaction
    roles: [event]
    aliases: [loyalty_point_transactions, loyalty_transactions, points_transactions, miles_transactions, points_ledger]
  - name: ServiceProvider
    roles: [party]
    aliases: [service_providers, service_provider, suppliers, supplier, vendors, partners]
  - name: Airline
    roles: [party]
    aliases: [airlines, airline, carriers, carrier, operating_carriers]
    description: this package's addition, not the vocabulary's
  # Where, and the things that are sold and operated.
  - name: Airport
    roles: [place]
    drawn_as: airfield
    aliases: [airports, airport, stations, airport_codes]
    description: this package's addition, not the vocabulary's
  - name: Property
    roles: [place]
    aliases: [properties, property, hotels, hotel, resorts]
  - name: Aircraft
    roles: [asset]
    aliases: [aircraft, aircrafts, planes, tails, fleet]
    description: this package's addition, not the vocabulary's
  - name: Seat
    roles: [asset]
    aliases: [seats, seat, seat_map, seat_maps]
  - name: BaggageItem
    roles: [asset]
    aliases: [baggage_items, baggage, bags, checked_bags, luggage]
  - name: Voucher
    roles: [asset]
    aliases: [vouchers, voucher, travel_credits, travel_vouchers, gift_certificates]
  - name: SupplierContract
    roles: [asset]
    drawn_as: contract
    aliases: [supplier_contracts, supplier_contract, partner_contracts, vendor_contracts]
  # Reference data: what can be sold, and how.
  - name: Route
    roles: [catalog]
    aliases: [routes, route, city_pairs, origin_destinations, markets]
  - name: RoomType
    roles: [catalog]
    aliases: [room_types, room_type, room_categories, room_classes]
  - name: PropertyListing
    roles: [catalog]
    aliases: [property_listings, property_listing, listings, hotel_listings]
  - name: DistributionChannel
    roles: [catalog]
    aliases: [distribution_channels, distribution_channel, sales_channels, channels, booking_channels]
  - name: TravelOffer
    roles: [catalog]
    aliases: [travel_offers, travel_offer, offers, offer, shopping_offers]
    parts: [OfferItem]
  - name: OfferItem
    roles: [catalog]
    aliases: [offer_items, offer_item, offer_lines]
  - name: FareRule
    roles: [catalog]
    aliases: [fare_rules, fare_rule, fare_conditions, rate_rules]
  - name: GroundService
    roles: [catalog]
    aliases: [ground_services, ground_service, ground_handling, ground_handling_services]
  - name: LoyaltyBenefit
    roles: [catalog]
    aliases: [loyalty_benefits, loyalty_benefit, member_benefits, tier_benefits]
  # Inventory and capacity.
  - name: Flight
    roles: [event]
    aliases: [flights, flight, flight_legs, flight_schedule, flight_schedules]
    parts: [DelayEvent]
  - name: DelayEvent
    roles: [event]
    aliases: [delay_events, delay_event, delays, flight_delays]
  - name: Departure
    roles: [event]
    aliases: [departures, departure, tour_departures, sailings, scheduled_departures]
    description: one dated run of a scheduled service — a tour, a sailing, a train
  - name: InventoryAllocation
    roles: [stock]
    drawn_as: grid
    aliases: [inventory_allocations, inventory_allocation, allotments, room_allotments, seat_allocations]
  - name: InventoryHold
    roles: [stock]
    aliases: [inventory_holds, inventory_hold, seat_holds, room_blocks, held_inventory]
  - name: CapacitySnapshot
    roles: [stock]
    aliases: [capacity_snapshots, capacity_snapshot, seat_availability, room_availability, availability]
  - name: OccupancySnapshot
    roles: [stock]
    aliases: [occupancy_snapshots, occupancy_snapshot, occupancy, daily_occupancy, load_factors]
  - name: YieldForecast
    roles: [event]
