  - name: Ticket
    roles: [transaction]
    aliases: [tickets, ticket, e_tickets, etickets, ticket_coupons]
  - name: AncillaryPurchase
    roles: [transaction]
    aliases: [ancillary_purchases, ancillaries, ancillary_sales, ancillary_orders, emds]
  - name: SettlementRecord
