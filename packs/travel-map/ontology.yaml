  - name: ExperienceBooking
    roles: [transaction]
    aliases: [experience_bookings, experience_booking, activity_bookings, tour_bookings, excursion_bookings]
  # Payment and ticketing.
  - name: Order
    roles: [transaction]
    aliases: [orders, order, travel_orders, sales_orders]
  - name: Payment
