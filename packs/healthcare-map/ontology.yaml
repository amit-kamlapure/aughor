# The healthcare providers and hospitals industry vocabulary (AUGHOR_ATLAS_INDUSTRY_VOCABULARY_v1, 2026-11-11: 66
# reference types) as an industry map: what a provider's data is expected to hold, matched to tables by name or alias
# and measured — expectations, never facts. Sixty-five objects: Treatment Episode is folded into EpisodeOfCare as a
# spelling of it; every other type is an object here (Consent is named PatientConsent).
#
# Two readings were made, and both are this package's, not the vocabulary's:
#   * its ten classes are read onto the eight roles a map has, by meaning and not by the class it printed (a
#     medication administration is an event, a medication is reference data, a staff assignment is not a party, an
#     order inside the hospital is an event and not a commercial exchange);
#   * a record of activity is a PART of the thing it happened to (an encounter's admission, transfers, discharge and
#     diagnoses; a claim's responses; an order's report and the report's results), never a thing beside it — the
#     vocabulary lists each as a type of its own.
# The vocabulary names no table spellings; every alias below is a guess the data confirms or leaves unmatched. Nothing
# here creates an object: one the data has no table for is never proposed and never mentioned.
