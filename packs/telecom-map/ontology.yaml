  # Billing and collections.
  - name: BillingAccount
    roles: [asset]
    drawn_as: vault
    aliases: [billing_accounts, billing_account, accounts, customer_accounts]
  - name: BillCycle
    roles: [calendar]
    aliases: [bill_cycles, bill_cycle, billing_cycles, billing_periods]
  - name: CustomerBill
    roles: [transaction]
    aliases: [customer_bills, customer_bill, bills, bill, invoices, invoice]
    parts: [TaxCharge]
  - name: TaxCharge
    roles: [event]
    aliases: [tax_charges, tax_charge, bill_taxes, tax_lines, invoice_taxes]
  - name: Payment
    roles: [transaction]
    aliases: [payments, payment, bill_payments, customer_payments]
  - name: Adjustment
