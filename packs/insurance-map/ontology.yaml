  - name: Claimant
    roles: [party]
    aliases: [claimants, claimant, claim_parties, injured_parties]
  - name: Adjuster
    roles: [party]
    aliases: [adjusters, adjuster, claims_adjusters, claim_handlers, loss_adjusters, examiners]
  - name: ClaimAssessment
    roles: [event]
    aliases: [claim_assessments, claim_assessment, claim_evaluations, damage_assessments, appraisals, claim_reviews]
  - name: Reserve
    roles: [stock]
    aliases: [reserves, reserve, claim_reserves, loss_reserves, case_reserves]
    description: the amount set aside for a claim or a book, at a moment
  # Settlement and recovery.
  - name: ClaimSettlement
    roles: [transaction]
