  # Finance & productivity.
  - name: CostCenter
    roles: [catalog]
    aliases: [cost_centers, cost_centres, cost_center]
  - name: StandardCost
    roles: [catalog]
    aliases: [standard_costs, standard_cost, item_costs, cost_rollups]
  - name: VarianceAnalysis
    roles: [event]
    aliases: [variance_analysis, variance_analyses, cost_variances, production_variances, variances]
  - name: ProductionYield
    roles: [event]
    aliases: [production_yields, production_yield, yields, yield_records, production_output]
  - name: ScrapEvent
    roles: [event]
    aliases: [scrap_events, scrap, scrap_records, scrap_transactions, rejects]
  - name: EnergyUseRecord
    roles: [event]
    aliases: [energy_use_records, energy_use, energy_consumption, energy_readings, utility_usage]
