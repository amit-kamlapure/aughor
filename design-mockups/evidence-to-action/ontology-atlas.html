<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Atlas · theLook · mockup</title>
<!--
  Mockup, 2026-11-10 (second pass). The Business Atlas of PRAMANYX_BUSINESS_ATLAS_v3_0 — a 2.5D business landscape with
  five lenses and a persistent inspector — composed from theLook's LIVE ontology (connection 8233e4fd, schema thelook)
  instead of sample data. Every structure stands for something the ontology holds, and every figure was read from the
  API and embedded as it came back:
    GET /object-types          the object types, their objects, keys and links   (the structures)
    GET /ontology/processes    the process: stages, moves, exit, promises, impact (the route)
    GET /metrics/coverage/…    the areas the retail package reads the business by (the value chain)
    GET /ontology/release, /ontology/draft, /ontology/kinetic-actions            (evidence, studio, actions)
  The mockup's own choices, each said on the page: where a structure stands (position is order, not geography), and
  which stage stands beside which object type. Buttons that leave the page go nowhere.
-->
<style>
:root {
  --bg-0: #111113; --bg-1: #18191b; --bg-2: #212225; --bg-hover: #27292d;
  --t1: #edeef0; --t2: #b0b4ba; --t3: #8b8f96;
  --b0: #2e3135; --b1: #43474d; --b2: #5a6169;
  --blue1: #0d2847; --blue2: #205d9e; --blue3: #70b8ff; --blue4: #7db8ff;
  --amb1: #2d2008; --amb3: #ffc53d; --amb4: #ffca4a;
  --grn1: #132d21; --grn4: #6fd392;
  --red1: #3b1219; --red4: #ff9592;
  --teal: #4ccce6;
  --font: "Source Sans 3", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --r2: 3px; --r3: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg-0); color: var(--t1); font: 13px/1.45 var(--font); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue3); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr) 28px; height: 100vh; }
@media (max-width: 1180px) { .app { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } .main { position: relative; } .insp { position: absolute; right: 0; top: 0; bottom: 0; width: 320px; box-shadow: -18px 0 40px rgba(0, 0, 0, .5); z-index: 5; } .body .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .body .chain { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); } .body .two, .body .three { grid-template-columns: minmax(0, 1fr); } .top .search { display: none; } }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--b0); }
.brand { font-weight: 700; letter-spacing: .1em; }
.crumb { color: var(--t3); } .crumb b { color: var(--t1); font-weight: 600; }
.top .search { position: relative; margin-left: auto; width: 360px; height: 28px; border: 1px solid var(--b1); border-radius: var(--r2); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--t3); font-size: 12px; }
.top .search:focus-within { border-color: var(--blue3); }
.top .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--t1); font: inherit; }
.top .search .kbd { font: 500 11px var(--mono); color: var(--t3); }
.qres { position: absolute; top: 32px; left: -1px; right: -1px; z-index: 20; background: var(--bg-2); border: 1px solid var(--b1); border-radius: var(--r3); box-shadow: 0 14px 34px rgba(0, 0, 0, .55); padding: 4px; }
.qres[hidden] { display: none; }
.qres button { display: flex; gap: 10px; width: 100%; padding: 7px 10px; border-radius: var(--r2); color: var(--t1); font-size: 13px; }
.qres button:hover, .qres button.first { background: var(--bg-hover); }
.qres .k { color: var(--t3); width: 86px; flex: none; font-size: 12px; }
.qres .v { margin-left: auto; color: var(--t3); font-variant-numeric: tabular-nums; font-size: 12px; }
.qres .none { padding: 8px 10px; color: var(--t3); }
.rail { background: var(--bg-1); border-right: 1px solid var(--b0); padding: 10px 0; overflow: auto; }
.rail .g { font-size: 11px; color: var(--t3); padding: 14px 16px 4px; text-transform: uppercase; letter-spacing: .08em; }
.rail .i { padding: 6px 16px; color: var(--t2); }
.rail .i.on { background: var(--blue1); color: var(--t1); box-shadow: inset 2px 0 0 var(--blue3); }
.status { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 14px; border-top: 1px solid var(--b0); color: var(--t3); font-size: 12px; white-space: nowrap; overflow: hidden; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grn4); display: inline-block; margin-right: 6px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.page { min-width: 0; overflow: auto; display: flex; flex-direction: column; }
.title { display: flex; align-items: center; gap: 14px; padding: 12px 20px 10px; flex-wrap: wrap; }
.title h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.005em; }
.facts { display: flex; gap: 6px; flex-wrap: wrap; }
.fact { height: 22px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--b0); border-radius: var(--r2); color: var(--t2); font-size: 12px; white-space: nowrap; }
.fact b { color: var(--t1); font-weight: 600; }
.acts { margin-left: auto; display: flex; gap: 8px; }
.btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border: 1px solid var(--b2); border-radius: var(--r2); color: var(--t1); font-size: 12px; white-space: nowrap; background: var(--bg-1); }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--blue3); color: #0b1220; border-color: transparent; font-weight: 600; }
.btn.amber { background: var(--amb1); color: var(--amb4); border-color: #6b5215; }
.btn.sm { height: 24px; padding: 0 8px; }
.btn[hidden] { display: none; }
.lenses { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--b0); }
.lens { padding: 9px 12px 8px; color: var(--t2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.lens:hover { color: var(--t1); }
.lens.on { color: var(--t1); border-bottom-color: var(--blue3); }
.lens em { font-style: normal; color: var(--t3); margin-left: 5px; font-size: 12px; }
.body { padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 14px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--b0); border-radius: var(--r3); background: var(--bg-1); }
.kpi { padding: 11px 16px 12px; border-left: 1px solid var(--b0); display: flex; flex-direction: column; gap: 1px; width: 100%; }
.kpi:first-child { border-left: 0; }
button.kpi:hover { background: var(--bg-2); }
.kpi .l { color: var(--t3); font-size: 12px; }
.kpi .v { font-size: 24px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .v small { font-size: 13px; font-weight: 500; color: var(--t2); margin-left: 6px; letter-spacing: 0; }
.kpi .s { color: var(--t3); font-size: 12px; }
.kpi.bad .v { color: var(--red4); } .kpi.warn .v { color: var(--amb4); }

/* ── the viewport ──────────────────────────────────────────────────────────── */
.vp { border: 1px solid var(--b0); border-radius: var(--r3); background: var(--bg-1); overflow: hidden; }
.vphead { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--b0); flex-wrap: wrap; }
.vphead h2 { margin: 0; font-size: 14px; font-weight: 600; }
.vphead .sub { color: var(--t3); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--b1); border-radius: var(--r2); overflow: hidden; }
.seg button { padding: 4px 11px; font-size: 12px; color: var(--t2); border-left: 1px solid var(--b1); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--blue1); color: var(--blue4); }
.seglab { color: var(--t3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.stagewrap { position: relative; overflow: hidden; background: radial-gradient(90% 70% at 50% 38%, #1b2a3b 0%, #111821 52%, #0a0d12 100%); cursor: grab; }
.stagewrap.drag { cursor: grabbing; }
.world { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 1100 / 590; transform-origin: 50% 50%; transition: transform 180ms ease-out; }
.world svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.st { cursor: pointer; transition: opacity 160ms; }
.st:hover { filter: brightness(1.13); }
.st:hover .pad, .st:focus-visible .pad { stroke: #a9c3da; }
.pad.alert { stroke: #b9585c; }
.st.on .pad { stroke: var(--blue3); stroke-width: 2; fill: #17304c; filter: drop-shadow(0 0 9px rgba(112, 184, 255, .55)); }
.dim .st:not(.lit) { opacity: .28; }
.dim .mk:not(.lit) { opacity: .3; }
.flow { cursor: pointer; }
.flow .hit { stroke: transparent; stroke-width: 22; fill: none; }
.flow .ln { stroke: var(--blue3); stroke-width: 3; fill: none; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(112, 184, 255, .75)); }
.flow .hd { fill: var(--blue3); }
.flow:hover .ln, .flow.on .ln { stroke: #b6dbff; stroke-width: 4; }
.flow.on .hd, .flow:hover .hd { fill: #b6dbff; }
.flow.exit .ln { stroke: #8b96a3; stroke-dasharray: 5 5; stroke-width: 2; filter: none; }
.flow.exit .hd { fill: #8b96a3; }
.link .ln { stroke: #9db4cb; stroke-width: 1.2; stroke-dasharray: 2 6; fill: none; opacity: .5; }
.hide-links .link, .hide-links .mk.lk { display: none; }
.st.exp { opacity: .72; }
.flow.exp .ln { stroke-dasharray: 6 6; filter: none; opacity: .6; } .flow.exp .hd { opacity: .6; } .flow.exp { cursor: default; }
.mk.lv { display: none; } .mk.lv.on { display: flex; }
.link.on .ln { stroke: var(--blue3); stroke-width: 1.8; opacity: 1; stroke-dasharray: 3 4; }
.hide-flow .flow, .hide-flow .mk.mv { display: none; }
.tracer { stroke: #e6f3ff; stroke-width: 5; fill: none; stroke-linecap: round; stroke-dasharray: 5 200; stroke-dashoffset: 205; opacity: 0; }
.tracing .tracer { opacity: 1; animation: trace 2600ms linear 1 forwards; }
@keyframes trace { from { stroke-dashoffset: 205; } to { stroke-dashoffset: 105; } }
@media (prefers-reduced-motion: reduce) { .tracing .tracer { animation: none; opacity: 0; } .world { transition: none; } }

.mk { font-size: clamp(9px, 1.23cqw, 13px); position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; pointer-events: none; transition: opacity 160ms; }
.mk.below { transform: translate(-50%, 0); flex-direction: column-reverse; }
.mk .board { display: block; pointer-events: auto; background: rgba(17, 22, 29, .94); border: 1px solid #3b4b5c; border-radius: 5px; padding: .3em .7em .38em; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); }
.mk .board:hover { border-color: #7f97b0; }
.mk.on .board { border-color: var(--blue3); box-shadow: 0 0 0 1px var(--blue3), 0 6px 18px rgba(0, 0, 0, .4); }
.mk .h { display: flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
.mk .ix { font: 600 .77em/1.6 var(--mono); padding: 0 .45em; border-radius: 2px; background: #1e3246; color: #a9cdf2; }
.mk .pt { width: 7px; height: 7px; border-radius: 50%; background: var(--grn4); flex: none; }
.mk .pt.ent { background: var(--teal); border-radius: 1px; }
.mk .pt.off { background: transparent; border: 1px dashed var(--t3); }
.mk .h::first-letter { text-transform: uppercase; }
.mk .c { color: var(--t2); font-weight: 400; margin-left: 3px; font-size: .93em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mk .c b { color: var(--t1); font-weight: 600; }
.mk .al { display: block; margin: 4px auto 0; width: max-content; padding: .3em .75em; border-radius: 2px; background: var(--red1); color: var(--red4); border: 1px solid #6e2a30; font-size: .9em; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: auto; }
.mk .al:hover { border-color: var(--red4); }
.mk .stem { width: 1px; height: var(--stem, 16px); background: #5d7389; }
.mk .foot { width: 5px; height: 5px; border-radius: 50%; background: #9db4cb; }
.mk.mv .board, .mk.lk .board { padding: .3em .75em; background: rgba(13, 17, 23, .9); border-color: #2c3a49; box-shadow: none; }
.mk.mv .c { color: #b9d6f5; } .mk.lk .board { border-style: dashed; border-color: #44576b; } .mk.lk .c { color: #a9bccf; font-size: .86em; }
.mk.mv, .mk.lk { transform: translate(-50%, -50%); }
.vpnote { position: absolute; right: 14px; top: 12px; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; max-width: 420px; }
.vpnote .k { font: 600 10.5px/1 var(--mono); letter-spacing: .14em; color: #7fa6cc; }
.vpnote .asof { padding: 3px 8px; border: 1px solid #334456; border-radius: 3px; color: var(--t2); font-size: 12px; background: rgba(13, 17, 23, .7); }
.legend { display: flex; gap: 18px; padding: 8px 14px; border-top: 1px solid var(--b0); color: var(--t2); font-size: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { display: inline-block; }
.zoom { position: absolute; right: 14px; bottom: 12px; display: flex; align-items: center; border: 1px solid #2c3a49; border-radius: 4px; background: rgba(13, 17, 23, .86); overflow: hidden; }
.zoom button { width: 30px; height: 28px; text-align: center; color: var(--t1); }
.zoom button:hover { background: var(--bg-hover); }
.zoom span { width: 52px; text-align: center; color: var(--t2); font-size: 12px; font-variant-numeric: tabular-nums; border-left: 1px solid #2c3a49; border-right: 1px solid #2c3a49; line-height: 28px; }

/* ── the precise 2D route ──────────────────────────────────────────────────── */
.flat { padding: 16px 18px 18px; }
.route { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(130px, 1.1fr) minmax(150px, 1fr) minmax(130px, 1.1fr) minmax(150px, 1fr) minmax(130px, 1.1fr) minmax(150px, 1fr); align-items: stretch; }
.lane { grid-column: 1 / -1; font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; padding: 2px 0 6px; }
.cell { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.pick { border: 1px solid var(--b1); border-radius: var(--r3); background: var(--bg-2); padding: 10px 12px; width: 100%; }
.pick:hover { background: var(--bg-hover); border-color: var(--b2); }
.pick.on { border-color: var(--blue3); box-shadow: 0 0 0 1px var(--blue3); }
.promise { border-left: 2px solid var(--amb3); }
.promise .nm { font-weight: 600; } .promise .ru { color: var(--t3); font-size: 12px; }
.promise .br { color: var(--red4); font-size: 12px; font-variant-numeric: tabular-nums; }
.stemv { height: 12px; width: 0; border-left: 1px solid var(--b2); margin: 0 auto; }
.stage .nm { font-weight: 600; font-size: 14px; }
.stage .big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stage .of { color: var(--t3); font-size: 12px; font-variant-numeric: tabular-nums; }
.stage .track { height: 4px; background: var(--b0); border-radius: 2px; margin: 6px 0 5px; overflow: hidden; }
.stage .track i { display: block; height: 100%; background: var(--blue3); }
.stage .an { font-family: var(--mono); font-size: 11px; color: var(--t3); }
.move { padding: 6px 10px; border: 1px solid transparent; border-radius: var(--r3); width: 100%; text-align: center; }
.move:hover { background: var(--bg-hover); } .move.on { border-color: var(--blue3); }
.move .n { font-variant-numeric: tabular-nums; font-size: 12px; } .move .d { font-variant-numeric: tabular-nums; color: var(--t3); font-size: 12px; }
.arrow { position: relative; height: 12px; margin: 3px 0; }
.arrow::before { content: ""; position: absolute; left: 0; right: 6px; top: 5px; border-top: 2px solid var(--blue3); }
.arrow::after { content: ""; position: absolute; right: 0; top: 1px; border: 5px solid transparent; border-left: 8px solid var(--blue3); border-right: 0; }
.arrow.dash::before { border-top: 1px dashed var(--amb3); top: 6px; } .arrow.dash::after { border-left-color: var(--amb3); }
.impact .n { color: var(--amb4); }
.exitp { border-style: dashed; } .exitp b { font-variant-numeric: tabular-nums; }

/* ── value chain, tables ───────────────────────────────────────────────────── */
.lab { font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.lab .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; }
.chain { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.area { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; background: var(--bg-1); border: 1px dashed var(--b1); border-radius: var(--r3); min-height: 92px; }
.area.has { border-style: solid; border-color: #2f6b4a; background: linear-gradient(180deg, #14241c, var(--bg-1) 70%); }
.area:hover { background: var(--bg-2); }
.area.on { border-color: var(--blue3); border-style: solid; box-shadow: 0 0 0 1px var(--blue3); }
.area .ix { font: 500 10.5px/1.2 var(--mono); color: var(--t3); letter-spacing: .06em; text-transform: uppercase; }
.area.has .ix { color: var(--grn4); }
.area .a { font-weight: 600; } .area .q { color: var(--t3); font-size: 12px; line-height: 1.3; flex: 1; }
.area .m { color: var(--t2); font-size: 12px; }
.nodata { color: var(--t3); font-size: 12px; margin-top: 8px; } .nodata b { color: var(--t2); font-weight: 500; }
.two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--bg-1); border: 1px solid var(--b0); border-radius: var(--r3); padding: 12px 14px 6px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .06em; padding: 0 10px 7px 0; border-bottom: 1px solid var(--b1); white-space: nowrap; }
td { height: 36px; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--b0); color: var(--t2); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td .nm { color: var(--t1); font-weight: 500; } td.mono, .mono { font-family: var(--mono); font-size: 12px; }
tr.rowbtn { cursor: pointer; } tr.rowbtn:hover td { background: var(--bg-2); }
tr.rowbtn.on td { background: #15253a; } tr.rowbtn.on td:first-child { box-shadow: inset 2px 0 0 var(--blue3); }
.card td:first-child, .card th:first-child { padding-left: 8px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--b1); border-radius: 2px; padding: 3px 9px; font-size: 11.5px; color: var(--t2); white-space: nowrap; }
.chip.ok { color: var(--grn4); border-color: #2f6b4a; background: var(--grn1); }
.chip.warn { color: var(--amb4); border-color: #6b5215; background: var(--amb1); }
.chip.bad { color: var(--red4); border-color: #6e2a30; background: var(--red1); }
.chip.blue { color: var(--blue4); border-color: #24507f; background: var(--blue1); }
.feed button { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; width: 100%; padding: 9px 0; border-bottom: 1px solid var(--b0); align-items: start; }
.feed button:last-child { border-bottom: 0; } .feed button:hover .w { text-decoration: underline; }
.feed .g { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.feed .g.bad { background: var(--red1); color: var(--red4); } .feed .g.warn { background: var(--amb1); color: var(--amb4); } .feed .g.info { background: var(--blue1); color: var(--blue4); }
.feed .w { color: var(--t1); font-weight: 500; } .feed .s { color: var(--t3); font-size: 12px; }
.ok { color: var(--grn4); } .warn { color: var(--amb4); } .bad { color: var(--red4); }

/* ── the inspector ─────────────────────────────────────────────────────────── */
.insp { width: 356px; border-left: 1px solid var(--b0); background: var(--bg-1); display: flex; flex-direction: column; min-height: 0; }
.insp[hidden] { display: none; }
.insp header { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 11px; border-bottom: 1px solid var(--b0); }
.insp header .k { font: 600 10.5px/1.3 var(--mono); color: #7fa6cc; text-transform: uppercase; letter-spacing: .12em; }
.insp header h3 { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
.insp header .x { margin-left: auto; width: 26px; height: 26px; border: 1px solid var(--b2); border-radius: var(--r2); text-align: center; color: var(--t2); flex: none; }

  units: { w: 3.4, d: 3.0, h: 32, says: "units on a plinth", draw(u, v, w, d) {                // role asset — things owned or held
    let s = shadow(u + .3, v + .3, w - .6, d - .6) + box(u + .3, v + .3, w - .6, d - .6, 5);

    return shadow(u + .7, v + .7, 1.4, 1.4) + box(u + .7, v + .7, 1.4, 1.4, 24) + faceL(u + .7, v + 2.1, 1.4, 16, 20, "#70b8ff") + faceR(u + 2.1, v + .7, 1.4, 16, 20, "#3f86cc") + box(u + 1.05, v + 1.05, .7, .7, 7, LIT, 24); } },
  layers: { w: 3.6, d: 3.6, h: 64, says: "stacked layers", draw(u, v) {                        // role event — activity, with no place of its own
    let s = shadow(u + .5, v + .5, 2.4, 2.4) + box(u + .5, v + .5, 2.4, 2.4, 12, { top: "#2f455b", left: "#23384c", right: "#18293a", line: "#567695" });

  bars: { w: 2.8, d: 2.6, h: 34, says: "a row of periods", draw(u, v, w, d) {                  // role calendar

  plinth: { w: 2.6, d: 2.6, h: 22, says: "a plain plinth", draw(u, v, w, d) {                  // a role the library does not know
    return shadow(u + .5, v + .5, w - 1, d - 1) + box(u + .5, v + .5, w - 1, d - 1, 5) + box(u + .95, v + .95, .7, .7, 9, STEEL, 5); } },
};
GLYPH.depot = { ...GLYPH.facility, says: "a depot with docks", draw: (u, v, w, d, o) => GLYPH.facility.draw(u, v, w, d, o, true) };   // a skin of role place
const ROLE_GLYPH = { place: "facility", location: "facility", party: "cluster", asset: "units", catalog: "tiles", stock: "stack", transaction: "hub", event: "layers", calendar: "bars" };
const ROLE_RANK = ["place", "location", "asset", "stock", "catalog", "party", "transaction", "calendar", "event"];     // the most telling role of several
const roleOf = (roles) => ROLE_RANK.find((r) => (roles || []).includes(r)) || "";
const STAGE = {                                                                               // a stage has three shapes, by where it stands on the route
  first: (u, v) => shadow(u + .4, v + .4, 1.4, 1.4) + box(u + .4, v + .4, 1.4, 1.4, 22) + faceL(u + .4, v + 1.8, 1.4, 14, 18, "#70b8ff") + box(u + .75, v + .75, .7, .7, 6, LIT, 22),
  mid: (u, v) => box(u + .5, v + .1, .36, .36, 28, STEEL) + box(u + .5, v + .1, .36, 2.0, 5, AMBER, 28) + box(u + .5, v + 1.74, .36, .36, 28, STEEL),
  last: (u, v) => shadow(u + .45, v + .45, 1.3, 1.3) + box(u + .45, v + .45, 1.3, 1.3, 8, TEALS) + box(u + .95, v + .95, .3, .3, 16, STEEL, 8) + box(u + .82, v + .82, .56, .56, 5, LIT, 24),

function seg(pick, a, b, cls = "") {
  const A = P3(...a), B = P3(...b), ang = Math.atan2(B[1] - A[1], B[0] - A[0]), L = 11, W = 5.5;
  const base = [B[0] - L * Math.cos(ang), B[1] - L * Math.sin(ang)];
  const h = [B, [base[0] - W * Math.sin(ang), base[1] + W * Math.cos(ang)], [base[0] + W * Math.sin(ang), base[1] - W * Math.cos(ang)]];
  return `<g class="flow ${cls}" ${pick ? `data-pick="${pick}" tabindex="0" role="button" aria-label="${esc(pick)}"` : ""}><path class="hit" d="M${A} L${B}"/><path class="ln" d="M${A} L${base}"/><polygon class="hd" points="${pts(h)}"/></g>`;
}
function marker({ at, pick, ix, kind = "stage", title, sub = "", alert, stem = 16, cls = "", tables = "" }) {

  return `<div class="mk ${cls}" data-mk="${pick}" data-tables="${tables}" style="left:${((x - 200) / 11).toFixed(2)}%;top:${((y - 50) / 5.9).toFixed(2)}%;--stem:${stem}px">
    <div><button class="board" data-pick="${pick}"><span class="h">${ix ? `<span class="ix">${ix}</span>` : ""}<span class="pt ${kind === "entity" ? "ent" : kind === "off" ? "off" : ""}"></span>${esc(title)}<span class="c">${sub}</span></span></button>${alert ? `<button class="al" data-pick="${alert.pick}">${alert.text}</button>` : ""}</div>

const tag = (at, text, pick, cls, attrs = "") => { const [x, y] = P3(...at);

/* ── the composer: a model in, a scene out. Same code for every business. ── */
function compose(M) {
  const through = new Set(M.processes.map((p) => p.object)), byId = Object.fromEntries(M.objects.map((o) => [o.id, o]));
  const adj = Object.fromEntries(M.objects.map((o) => [o.id, new Set()]));
  M.links.forEach((l) => { if (adj[l.a] && adj[l.b] && l.a !== l.b) { adj[l.a].add(l.b); adj[l.b].add(l.a); } });
  // 1 · order: breadth-first over the links, from what goes through a process — or, with none declared, from the most linked type
  let seeds = [...through].filter((x) => adj[x]);
  if (!seeds.length) seeds = [M.objects.slice().sort((a, b) => adj[b.id].size - adj[a.id].size || a.id.localeCompare(b.id))[0].id];
  const dist = {}, order = [], queue = [...seeds]; seeds.forEach((x) => { dist[x] = 0; });
  while (queue.length) { const x = queue.shift(); order.push(x); [...adj[x]].sort().forEach((y) => { if (dist[y] === undefined) { dist[y] = dist[x] + 1; queue.push(y); } }); }
  M.objects.forEach((o) => { if (dist[o.id] === undefined) { dist[o.id] = null; order.push(o.id); } });
  const rank = Object.fromEntries(order.map((id, i) => [id, i]));
  // 2 · shape: a glyph from the role (a skin may refine it); what goes through a process IS its route and gets no structure
  const items = M.objects.filter((o) => !through.has(o.id)).map((o) => { const g = GLYPH[o.skin] ? o.skin : (ROLE_GLYPH[o.role] || "plinth"); return { o, g, w: GLYPH[g].w, d: GLYPH[g].d }; });
  // 3 · rows: the largest footprints stand behind the routes, the rest in front; each row in link order
  const GAP = 1.3, BUDGET = 27, back = [], front = []; let used = 0;
  items.slice().sort((a, b) => b.w * b.d - a.w * a.d || rank[a.o.id] - rank[b.o.id]).forEach((it) => { if (used + it.w + GAP <= BUDGET) { back.push(it); used += it.w + GAP; } else front.push(it); });
  [back, front].forEach((r) => r.sort((a, b) => rank[a.o.id] - rank[b.o.id]));
  const len = (r) => r.reduce((s, it) => s + it.w + GAP, -GAP);
  const lanes = M.processes.length ? M.processes : [null], nMax = Math.max(0, ...M.processes.map((p) => p.stages.length));
  const U = Math.max(len(back), front.length ? len(front) : 0, nMax ? nMax * 5.6 : 12) + 2.6;
  const vEdge = 1.2 + Math.max(0, ...back.map((it) => it.d)), laneV = (k) => vEdge + (M.processes.length ? 4.4 : 2.3) + k * 5.2, hasExit = M.processes.some((p) => p.exit);
  const vRow2 = laneV(lanes.length - 1) + 1.1 + (hasExit ? 3.7 : 1.9);
  const V = (front.length ? vRow2 + Math.max(...front.map((it) => it.d)) : laneV(lanes.length - 1) + 1.1 + (hasExit ? 3.5 : 1.3)) + 1.2;
  S = Math.min(1040 / (U + V), 890 / (U + V), 30); ZK = S / 25;
  OX = 230 + V * S + (1040 - (U + V) * S) / 2; OY = 168 + (445 - (U + V) * S / 2) / 2;
  const lay = (row, edge, toFront) => { let u = (U - len(row)) / 2; row.forEach((it) => { it.u = u; it.v = toFront ? edge - it.d : edge; u += it.w + GAP; }); };
  lay(back, vEdge, true); lay(front, vRow2, false);
  const centre = {}, why = {}; items.forEach((it) => { centre[it.o.id] = [it.u + it.w / 2, it.v + it.d / 2]; });
  // 4 · draw: ground, lanes, links under everything; then structures back to front
  const top = [P3(0, 0), P3(U, 0), P3(U, V), P3(0, V)];
  let g = poly([P3(0, V, 0), P3(U, V, 0), P3(U, V, -16), P3(0, V, -16)], "url(#edgeL)") + poly([P3(U, 0, 0), P3(U, V, 0), P3(U, V, -16), P3(U, 0, -16)], "#080c12") + poly(top, "url(#gnd)", 'stroke="#33485c" stroke-width="1"') + poly(top, "url(#spot)");
  for (let i = 1; i < U; i++) g += ln(P3(i, 0), P3(i, V), "#fff", 'stroke-opacity=".03"');
  for (let j = 1; j < V; j++) g += ln(P3(0, j), P3(U, j), "#fff", 'stroke-opacity=".03"');
  let flows = "", stagesSvg = "", marks = "", tracer = "";
  lanes.forEach((p, k) => { const lv = laneV(k), bed = [P3(1.3, lv - .6), P3(U - 1.3, lv - .6), P3(U - 1.3, lv + .6), P3(1.3, lv + .6)];
    if (!p) { g += poly(bed, "#0c131b", 'fill-opacity=".5" stroke="#3d566e" stroke-width="1" stroke-dasharray="6 6"'); marks += tag([U / 2, lv, 0], "No process is declared here", null, "lk"); return; }
    g += poly(bed, "#0c131b", `stroke="#2c4055" stroke-width="1" ${p.measured ? "" : 'stroke-dasharray="6 6" fill-opacity=".55"'}`) + ln(P3(1.6, lv), P3(U - 1.6, lv), "#70b8ff", 'stroke-opacity=".16" stroke-width="1" stroke-dasharray="3 9"');
    const nS = p.stages.length, cu = (i) => (nS > 1 ? 3.3 + i * (U - 6.6) / (nS - 1) : U / 2);
    centre[p.object] = centre[p.object] || [cu(0), lv];
    p.stages.forEach((st, i) => { const c = cu(i), shape = i === 0 ? "first" : i === nS - 1 ? "last" : "mid";
      stagesSvg += `<g class="st ${p.measured ? "" : "exp"}" data-pick="${st.pick}" data-tables="${p.tables || ""}" tabindex="0" role="button" aria-label="${esc(`Stage ${i + 1}, ${st.label}`)}">${pad(c - 1.1, lv - 1.1, 2.2, 2.2, !p.measured ? "ghost" : st.alert ? "alert" : "stage")}${STAGE[shape](c - 1.1, lv - 1.1)}</g>`;
      marks += marker({ at: [c, lv, 31], pick: st.pick, ix: String(i + 1).padStart(2, "0"), kind: p.measured ? "stage" : "off", title: st.label, sub: st.reached != null ? `<b>${n(st.reached)}</b>` : i === 0 && !p.measured ? esc(p.name) : "", alert: st.alert, stem: 9, tables: p.tables || "" });
      why[st.pick] = `Stage ${i + 1} of ${nS} of ${p.name}, in order along its route. Position is order, not geography.`;
      if (i) { flows += seg(st.movePick || "", [cu(i - 1) + 1.25, lv], [c - 1.15, lv], p.measured ? "" : "exp"); if (st.moved != null) marks += tag([(cu(i - 1) + c) / 2, lv, 0], `<b>${n(st.moved)}</b> →`, st.movePick, "mv"); } });
    if (p.measured) tracer += `<path class="tracer" pathLength="100" d="M${P3(cu(0), lv)} L${P3(cu(nS - 1), lv)}"/>`;
    if (p.exit) { const c = cu(p.exit.from || 0);
      g += poly([P3(c - .3, lv + .6), P3(c + .3, lv + .6), P3(c + .3, lv + 2.4), P3(c - .3, lv + 2.4)], "#0c131b", 'stroke="#2c4055" stroke-width="1"');
      flows += seg(p.exit.pick, [c, lv + 1.15], [c, lv + 2.35], "exit");
      const a = P3(c - .5, lv + 2.8), b = P3(c + .5, lv + 3.6), e = P3(c + .5, lv + 2.8), f = P3(c - .5, lv + 3.6);
      stagesSvg += `<g class="st" data-pick="${p.exit.pick}" data-tables="${p.tables || ""}" tabindex="0" role="button" aria-label="Leaves the process">${pad(c - 1, lv + 2.4, 2, 1.6, "ghost")}<path d="M${a} L${b} M${e} L${f}" stroke="#8b96a3" stroke-width="2" stroke-linecap="round"/></g>`;
      marks += tag([c + 1.9, lv + 3.9, 0], `<b>${n(p.exit.n)}</b> left · ${esc(p.exit.label)}`, p.exit.pick, "mv ex"); } });
  let links = "";
  M.links.forEach((l) => { const A = centre[l.a], B = centre[l.b]; if (!A || !B || l.a === l.b) return;
    links += `<g class="link" data-a="${l.a}" data-b="${l.b}"><path class="ln" d="M${P3(...A)} L${P3(...B)}"/></g>`;
    marks += tag([(A[0] + B[0]) / 2, (A[1] + B[1]) / 2, 0], esc(l.verb), null, "lk lv", `data-a="${l.a}" data-b="${l.b}"`); });
  const drawRow = (row) => row.map((it) => { const G = GLYPH[it.g], o = it.o;
    marks += marker({ at: [it.u + it.w / 2, it.v + it.d / 2, G.h + 6], pick: "entity:" + o.id, kind: M.measured ? "entity" : "off", title: o.name, sub: o.count != null ? `<b>${n(o.count)}</b>` : "", stem: 14, tables: o.table || "" });
    why["entity:" + o.id] = `Drawn as ${G.says} because its role is ${o.role || "not known"}${o.as ? ` (the package's ${o.as})` : ""}${(it.g === "facility" || it.g === "depot") && o.count && o.count <= 12 ? "; one bay per object" : ""}${o.skin && GLYPH[o.skin] ? "; the package hints this skin" : ""}. ` +
      (dist[o.id] === null ? "It links to no other type, so it stands last." : dist[o.id] === 0 ? "It is the most linked type, so the others are ordered from it." : `It stands ${dist[o.id]} link${dist[o.id] === 1 ? "" : "s"} from ${byId[seeds[0]].name}; position is order, not geography.`);
    return `<g class="st ${M.measured ? "" : "exp"}" data-pick="entity:${o.id}" data-tables="${o.table || ""}" tabindex="0" role="button" aria-label="${esc(o.name)}">${pad(it.u, it.v, it.w, it.d, M.measured ? "" : "ghost")}${G.draw(it.u, it.v, it.w, it.d, o)}</g>`; }).join("");
  const structures = drawRow(back) + stagesSvg + drawRow(front);
  return { why, structures: items.length, routes: M.processes.length, markers: marks,
    svg: `<svg viewBox="200 50 1100 590" role="img" aria-label="${esc(`Isometric business landscape of ${M.title}: ${items.map((it) => it.o.name).join(", ")}. Each structure can be selected.`)}">
    <defs>
      <linearGradient id="gnd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2836"/><stop offset="1" stop-color="#111922"/></linearGradient>
      <radialGradient id="spot" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#5aa0e6" stop-opacity=".13"/><stop offset="1" stop-color="#5aa0e6" stop-opacity="0"/></radialGradient>

      <linearGradient id="padf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2d3b"/><stop offset="1" stop-color="#162029"/></linearGradient>

      <linearGradient id="shR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
      <linearGradient id="shT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>

}
/* ══ end of the composer ══ */

/* ── the models: what the composer is handed. The live one is this connection's ontology; a pack's is what it EXPECTS. ── */
const spaced = (s) => String(s).replace(/([a-z])([A-Z])/g, "$1 $2").replace(/_/g, " ");
function model() {
  if (biz === "live") { const tbl = T[P.entity_id].table;
    return { id: "live", title: D.connection.name, measured: true,
      objects: D.types.map((t) => { const r = D.roles[t.id] || {}; return { id: t.id, name: t.display_name, role: r.role || (r.builder === "event" ? "event" : ""), as: r.as || "", skin: r.skin || "", count: rowsOf(t.id), table: t.table || "" }; }),
      links: D.links.map((l) => ({ a: bySnake[l.from].id, b: bySnake[l.to].id, verb: l.verb || String(l.business_name).replace(/_/g, " ") })),
      processes: [{ id: P.id, name: P.display_name, object: P.entity_id, measured: true, tables: tbl,
        stages: P.stages.map((s, i) => ({ pick: "stage:" + s.name, label: s.display_name || s.name, reached: s.reached, movePick: "move:" + s.name,
          moved: i ? (seen(P.stages[i - 1].name, s.name) || {}).objects : null, alert: s.promise && s.promise.open_overdue > 0 ? { pick: "promise:" + s.promise.name, text: `${n(s.promise.open_overdue)} overdue` } : null })),
        exit: P.leaves ? { pick: "exit", n: P.leaves.left, label: P.leaves.values.join(", "), from: 0 } : null }] }; }
  const K = D.packs[biz];
  return { id: biz, title: K.title, measured: false,
    objects: K.objects.map((o) => ({ id: o.name, name: spaced(o.name), role: roleOf(o.roles), skin: o.skin, count: null })),
    links: K.links.map((l) => ({ a: l.from, b: l.to, verb: l.cardinality })),

      ["9 in 10 within", `${days(t.p90_days)} days`], ["19 in 20 within", `${days(t.p95_days)} days`], ["As a property", mono(t.lag)]];
    acts = ["Open these objects", "View SQL", "Ask about this"];
  } else if (kind === "promise") { const p = PR[key], s = P.stages.find((x) => x.promise === p);
    k = "Promise"; title = `${p.name} — ${s.name} within ${p.within_days} days`; said = p.note;
    figs = [[n(p.open_overdue), "not reached, already past", "bad"], [pct(p.breach_rate), "of those that reached it broke it", "bad"]];
    rows = [["Kept per", esc(p.grain_id)], ["Reached, in force", n(p.reached)], ["Broke it", n(p.breached)], ["Kept it", n(p.kept)], ["Not reached yet", n(p.open)],
      ["As of", `${when(p.as_of)} — the data's clock`], ["Target", p.target == null ? "none declared" : pct(p.target)], ["Late objects", mono(p.segment)], ["Overdue objects", mono(p.overdue_segment)], ["Breach rate", mono(p.metric)]];
    if (impact) rel.push(["impact", impact.display_name, impact.verified ? "the data shows it" : "the data does not show it"]);
    rel.push(["stage:" + s.name, `Stage · ${s.name}`, `${n(s.reached)} reached it`]);
    acts = [`Open the ${n(p.open_overdue)} overdue`, "Ask why", "Flag for review…"];
  } else if (kind === "exit") { const L = P.leaves; k = "Leaves the process"; title = `${L.property} is ${L.values.join(", ")}`; said = L.note;
    figs = [[n(L.left), "left"], [n(L.unknown), "could not be read"]];
    rows = [["Property", mono(L.property)], ["Values no object holds", L.missing.length ? esc(L.missing.join(", ")) : "none"]]; acts = ["Open these objects", "View SQL"];
  } else if (kind === "impact") { const I = impact; k = "What one promise does to another"; title = I.display_name; said = I.reading;
    figs = [[pct(I.rate_when_broke), "broke delivery after a late dispatch"], [pct(I.rate_when_kept), "broke delivery after an on-time one"]];
    rows = [["Declared as", esc(I.mechanism)], ["Objects compared", n(I.objects)], ["Saw dispatch broken", n(I.upstream_broke)], ["Saw dispatch kept", n(I.upstream_kept)], ["Window", esc(I.window)], ["Shown by the data", I.verified ? "yes" : "no"]];
    rel = promises.map((p) => ["promise:" + p.name, `${p.name} promise`, `${pct(p.breach_rate)} broke it`]); acts = ["Ask about this", "Edit"];
  } else if (kind === "entity") { const t = T[key], r = rowsOf(key);
    k = `Object type · ${String(t.role || "").replace(/_/g, " ")}`; title = t.display_name;
    figs = [[r == null ? "not counted" : n(r), key === "Event" ? "rows in events" : "objects"], [String(t.links), "links to other types"]];
    rows = [["Key", t.key ? mono(t.key) + (t.key_verified ? " · verified" : "") : "none declared"], ["Table", t.table ? mono(t.table) : "no table"], ["Properties", n(t.properties)], ["Origin", esc(t.origin)],
      ["Areas", esc(D.areas.filter((a) => a.tables.some((x) => x.name === t.table)).map((a) => a.name).join(", ") || "in no area")]];
    if (key === "DistributionCenter") rows.splice(2, 0, ["Stores", `${n(rowsOf("InventoryItem"))} inventory items`]);
    rel = D.links.filter((l) => l.from === t.object_type || l.to === t.object_type).slice(0, 6).map((l) => { const o = bySnake[l.from === t.object_type ? l.to : l.from];
      return ["entity:" + o.id, `${l.from === t.object_type ? "→" : "←"} ${o.display_name}`, `${l.verb || String(l.business_name).replace(/_/g, " ")} · ${l.cardinality}`]; });
    if (key === P.entity_id) rel.unshift(["stage:placed", P.display_name, "goes through this process"]);
    acts = ["Open the objects", "Open the type", "Ask about this"];
  }
  return { k, title, figs, rows, said, acts, rel, why: SCENE.why[picked] || "" };
}
function inspector() {
  const el = $("insp"), I = inspect();
  if (!I) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<header><div><div class="k">${esc(I.k)}</div><h3>${esc(I.title)}</h3></div><button class="x" id="closeInsp" aria-label="Close">×</button></header>
    <div class="sc"><div class="figs">${I.figs.map(([v, l, c]) => `<div class="fig ${c || ""}"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>
      <dl>${I.rows.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join("")}</dl>
      ${I.said ? `<div class="sec">What the measurement said</div><div class="said">${esc(I.said)}</div>` : ""}
      ${I.rel.length ? `<div class="sec">Connected</div><div class="rel">${I.rel.map(([p, a, b]) => `<button data-pick="${p}"><span>${esc(a)}</span><span class="v" style="margin-left:auto">${esc(b)}</span></button>`).join("")}</div>` : ""}
      ${I.why ? `<div class="sec">Why it is drawn here</div><div class="why">${esc(I.why)}</div>` : ""}
      <div class="do">${I.acts.map((a, i) => `<button class="btn ${i === 0 ? "primary" : ""}">${esc(a)}</button>`).join("")}</div></div>
    <footer>Release ${D.release.number} · published ${day(D.release.at)} by ${esc(D.release.by)} · counted ${when(P.measured_at)}</footer>`;
}

/* ══ wiring ══ */
let LIVE_FACTS = "";
function shell() {
  LIVE_FACTS = `<span class="fact">${esc(D.connection.name)} · ${esc(D.connection.schema)}</span><span class="fact">release <b>${D.release.number}</b> · ${day(D.release.at)}</span>` +
    `<span class="fact">counted <b>${when(P.measured_at)}</b></span><span class="fact">${esc(D.pack)} package</span>`;
  $("reviewBtn").textContent = `Review ${D.draft.counts.proposed}`;
  $("status").innerHTML = `<span><span class="dot"></span>${esc(D.connection.name)} · ${esc(D.connection.engine)}</span><span>release ${D.release.number} in force</span>` +
    `<span>process counts are kept once for every reader; a row policy recounts them for you and says so</span><span style="margin-left:auto">live API data, read ${esc(D.read_at)}</span>`;
}
function draw() {
  if (biz !== "live") { lens = "overview"; view = "25d"; }
  $("facts").innerHTML = biz === "live" ? LIVE_FACTS : `<span class="fact">${esc(D.packs[biz].title)} package</span><span class="fact">its expected shape</span><span class="fact"><b>no source connected</b> · nothing measured</span>`;
  $("reviewBtn").hidden = biz !== "live";
  SCENE = compose(model());
  $("lenses").innerHTML = [["overview", "Overview"], ["processes", "Processes", D.counts.processes], ["entities", "Entities", D.types.length], ["evidence", "Evidence"], ["studio", "Model Studio", D.draft.counts.proposed]]
    .map(([k, l, c]) => `<button class="lens ${lens === k ? "on" : ""}" role="tab" aria-selected="${lens === k}" data-lens="${k}" ${biz !== "live" && k !== "overview" ? 'disabled style="opacity:.4;cursor:default"' : ""}>${l}${c != null ? `<em>${c}</em>` : ""}</button>`).join("");
  $("body").innerHTML = biz !== "live" ? viewport() + shapeTable() : lens === "overview" ? kpis() + viewport() + shapeTable() + chain() + `<div class="two">${coverage()}${feed()}</div>` :
    lens === "processes" ? lensProcesses() : lens === "entities" ? lensEntities() : lens === "evidence" ? lensEvidence() : lensStudio();
  // selection and area lighting in the scene
  const lit = area ? new Set(D.areas.find((a) => a.id === area).tables.map((t) => t.name)) : null;
  const pst = picked && picked.startsWith("promise:") ? "stage:" + P.stages.find((s) => s.promise && s.promise.name === picked.slice(8)).name : null;
  document.querySelectorAll(".st, .flow, .mk[data-mk]").forEach((el) => {
    const p = el.dataset.pick || el.dataset.mk; el.classList.toggle("on", p === picked || p === pst);
    if (lit && el.dataset.tables != null) el.classList.toggle("lit", el.dataset.tables.split(" ").some((t) => lit.has(t)));
  });
  document.querySelectorAll(".link, .mk.lv").forEach((el) => el.classList.toggle("on", picked === "entity:" + el.dataset.a || picked === "entity:" + el.dataset.b));
  inspector(); bind();
  history.replaceState(null, "", "#" + new URLSearchParams({ lens, view, pick: picked || "", ...(area ? { area } : {}), ...(biz !== "live" ? { biz } : {}) }).toString());
}
function pick(p) { if (p.startsWith("lens:")) { lens = p.slice(5); } else picked = p; draw(); }
function bind() {
  document.querySelectorAll("[data-pick]").forEach((b) => { b.onclick = (e) => { e.stopPropagation(); pick(b.dataset.pick); };
    if (b.tagName !== "BUTTON") b.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(b.dataset.pick); } }; });
  document.querySelectorAll("[data-go]").forEach((r) => r.onclick = () => pick(r.dataset.go));
  document.querySelectorAll("[data-lens]").forEach((b) => b.onclick = () => { lens = b.dataset.lens; draw(); });
  document.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => { view = b.dataset.view; draw(); });
  document.querySelectorAll("[data-biz]").forEach((b) => b.onclick = () => { biz = b.dataset.biz; picked = null; area = null; zoom = 1; pan = [0, 0]; draw(); });
  document.querySelectorAll("[data-flows]").forEach((b) => b.onclick = () => { flows = b.dataset.flows; draw(); });
  document.querySelectorAll("[data-area]").forEach((b) => b.onclick = () => { area = area === b.dataset.area ? null : b.dataset.area; draw(); });
  document.querySelectorAll("[data-zoom]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); const k = +b.dataset.zoom;
    if (k === 0) { zoom = 1; pan = [0, 0]; } else zoom = Math.min(2, Math.max(.75, +(zoom + k * .25).toFixed(2))); draw(); });
  const c = $("closeInsp"); if (c) c.onclick = () => { picked = null; draw(); };
  const t = $("trace"); if (t) t.onclick = () => { const w = $("world"); w.classList.remove("tracing"); void w.offsetWidth; w.classList.add("tracing"); setTimeout(() => w.classList.remove("tracing"), 2700); };
  const sw = $("stagewrap"); if (sw) { let from = null;
    sw.onpointerdown = (e) => { if (e.target.closest("button, .st, .flow")) return; from = [e.clientX - pan[0], e.clientY - pan[1]]; sw.classList.add("drag"); sw.setPointerCapture(e.pointerId); $("world").style.transition = "none"; };
    sw.onpointermove = (e) => { if (!from) return; pan = [e.clientX - from[0], e.clientY - from[1]]; $("world").style.transform = `translate(${pan[0]}px,${pan[1]}px) scale(${zoom})`; };
    sw.onpointerup = sw.onpointercancel = () => { from = null; sw.classList.remove("drag"); $("world").style.transition = ""; }; }
}
/* search: every stage, promise, object type and area, by name */
const INDEX = P.stages.map((s, i) => ({ k: `Stage ${i + 1}`, t: s.display_name || s.name, v: n(s.reached), p: "stage:" + s.name }))
  .concat(promises.map((p) => ({ k: "Promise", t: p.name, v: `${n(p.open_overdue)} overdue`, p: "promise:" + p.name })))
  .concat(D.types.map((t) => ({ k: "Object type", t: t.display_name, v: rowsOf(t.id) == null ? "" : n(rowsOf(t.id)), p: "entity:" + t.id })))
  .concat([{ k: "Exit", t: "Cancelled", v: n(P.leaves.left), p: "exit" }, { k: "Impact", t: impact.display_name, v: "", p: "impact" }])
  .concat(D.areas.filter((a) => a.rows > 0).map((a) => ({ k: "Area", t: a.name, v: plural(a.metrics.length, "metric", "metrics"), a: a.id })));
function goto(r) { biz = "live"; if (r.a) { area = r.a; lens = "overview"; view = "25d"; } else picked = r.p; $("q").value = ""; $("qres").hidden = true; $("q").blur(); draw(); }
function search() { const s = $("q").value.trim().toLowerCase(), box = $("qres"); if (!s) { box.hidden = true; return []; }
  const hits = INDEX.filter((r) => (r.t + " " + r.k).toLowerCase().includes(s)).slice(0, 8); box.hidden = false;
  box.innerHTML = hits.length ? hits.map((r, i) => `<button class="${i ? "" : "first"}" data-i="${INDEX.indexOf(r)}"><span class="k">${esc(r.k)}</span><span>${esc(r.t)}</span><span class="v">${esc(r.v)}</span></button>`).join("") : `<div class="none">Nothing in this ontology is called that.</div>`;
  box.querySelectorAll("button").forEach((b) => b.onmousedown = (e) => { e.preventDefault(); goto(INDEX[+b.dataset.i]); }); return hits; }
$("q").oninput = search; $("q").onfocus = search; $("q").onblur = () => setTimeout(() => { $("qres").hidden = true; }, 120);
$("q").onkeydown = (e) => { if (e.key === "Enter") { const h = search(); if (h[0]) goto(h[0]); } if (e.key === "Escape") { $("q").value = ""; $("q").blur(); e.stopPropagation(); } };
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("q").focus(); return; }
  if (e.target === $("q")) return;
  if (e.key === "Escape") { if (picked) picked = null; else if (area) area = null; draw(); }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && picked && picked.startsWith("stage:")) {   // step along the process
    const i = P.stages.findIndex((s) => "stage:" + s.name === picked) + (e.key === "ArrowRight" ? 1 : -1);
    if (P.stages[i]) { e.preventDefault(); picked = "stage:" + P.stages[i].name; draw(); } }
});
shell(); draw();
</script>
